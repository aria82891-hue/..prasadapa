<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PRASADAPA — Ujian SKU Penggalang Rakit</title>
<style>
:root {
  --red:#8f1820; --red2:#b52631; --gold:#d6a83a; --ink:#241b18;
  --paper:#fffdf8; --soft:#f5efe6; --line:#e5d8c9; --green:#1d7a4c;
  --shadow:0 12px 35px rgba(55,31,18,.10);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(145deg,#f6eee3,#fffdf8);color:var(--ink)}
button,input{font:inherit}
.hidden{display:none!important}
.app{max-width:1100px;margin:auto;padding:18px}
.hero{background:linear-gradient(135deg,var(--red),#641018);color:white;border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:var(--shadow)}
.brand{display:flex;gap:16px;align-items:center}
.logoMark{width:68px;height:68px;border:2px solid #f1d48a;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:19px;letter-spacing:1px;background:rgba(255,255,255,.08);overflow:hidden}.logoMark img{width:100%;height:100%;object-fit:cover}.login-brand{display:flex;align-items:center;gap:14px;margin-bottom:16px}.login-logo{width:92px;height:92px;object-fit:contain;border-radius:18px;border:1px solid var(--line);background:#fff;padding:4px}.level-select{appearance:auto}
.hero h1{margin:0;font-size:31px}
.hero h2{margin:3px 0 0;font-size:16px;font-weight:700;color:#ffe7a7}
.hero p{margin:4px 0 0;opacity:.88;font-size:13px}
.card{background:rgba(255,253,248,.96);border:1px solid var(--line);border-radius:22px;padding:20px;margin:16px 0;box-shadow:var(--shadow)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.section-title h2{margin:0;font-size:21px}
.small{font-size:13px;color:#756860;line-height:1.5}
.pill{background:#f5e4b8;color:#68490c;border-radius:999px;padding:7px 11px;font-weight:800;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}
.field{background:#fbf6ef;border:1px solid var(--line);border-radius:16px;padding:14px}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
.input{width:100%;border:1px solid #d9c9b9;border-radius:12px;padding:12px 13px;background:white;outline:none}
.input:focus{border-color:var(--red2);box-shadow:0 0 0 3px rgba(181,38,49,.10)}
.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--red);color:#fff}
.btn:hover{filter:brightness(1.05)}
.btn.gold{background:#b17a10}
.btn.ghost{background:#f2e9df;color:var(--ink)}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.login-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.sku-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:13px}
.sku{border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:11px}
.sku .num{font-size:12px;font-weight:900;color:var(--red)}
.sku h3{margin:0;font-size:16px}
.sku .meta{font-size:12px;color:#756860}
.status{font-size:12px;font-weight:800}
.status.pass{color:var(--green)} .status.work{color:#9a6500} .status.lock{color:#766a63}
.exam-top{position:sticky;top:0;z-index:10;background:rgba(255,253,248,.95);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:15px}
.exam-top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.progress{height:9px;background:#eadfd3;border-radius:99px;overflow:hidden;margin-top:10px}
.progress > div{height:100%;background:linear-gradient(90deg,var(--red),var(--gold));width:0}
.question{border:1px solid var(--line);border-radius:20px;background:#fff;padding:20px;margin:14px 0}
.qnum{font-size:12px;font-weight:900;color:var(--red);margin-bottom:8px}
.qtext{font-size:17px;font-weight:750;line-height:1.55;margin-bottom:15px}
.option{display:flex;gap:11px;align-items:flex-start;border:1px solid #dfd4c9;border-radius:14px;padding:13px;margin:9px 0;cursor:pointer;background:#fffdfb}
.option:hover{background:#fbf4ea;border-color:#c9b7a7}
.option input{margin-top:4px;accent-color:var(--red)}
.option b{min-width:22px}
.bottom-bar{display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:10px;background:rgba(255,253,248,.94);backdrop-filter:blur(12px);padding:10px;border:1px solid var(--line);border-radius:17px}
.result{text-align:center;padding:25px}
.score{font-size:64px;font-weight:950;color:var(--red);line-height:1}
.result.pass{border-color:#a8d6bd;background:#f1fbf5}
.result.fail{border-color:#e5b6b9;background:#fff5f5}
.result h2{margin:7px 0}
.cert{margin-top:18px;border:8px double var(--red);border-radius:16px;padding:30px;background:#fffaf0;text-align:center}
.cert .big{font:700 34px Georgia,serif;color:var(--red)}
.cert .name{font:800 28px Georgia,serif;margin:20px 0 5px}
.note{padding:12px 14px;border-radius:13px;background:#fff7db;border:1px solid #ead18b;font-size:13px;line-height:1.5}
@media(max-width:750px){
 .login-grid{grid-template-columns:1fr}
 .hero h1{font-size:25px}
 .app{padding:10px}
 .card{padding:15px;border-radius:18px}
 .qtext{font-size:16px}
 .bottom-bar{flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
<header class="hero">
  <div class="brand">
